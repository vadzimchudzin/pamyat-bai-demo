name: Prebuild high-resolution catalog photos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upscale-catalog.yml"
      - "scripts/upscale-catalog.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-photo-upscale
  cancel-in-progress: false

jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image processing library
        run: npm install --no-save --no-package-lock sharp@0.34.3
      - name: Upscale every catalog image offline
        run: node scripts/upscale-catalog.mjs
      - name: Commit processed catalog and immutable originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalog assets/catalog-originals
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Precompute high-resolution catalog photos"
          git push origin HEAD:main
