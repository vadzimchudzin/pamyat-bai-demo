<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расчёт — ПАМЯТЬ.БАЙ</title>
<link rel="stylesheet" href="/css/base.css?v=s1">
<link rel="stylesheet" href="/css/site.css?v=s1">
<link rel="stylesheet" href="/css/app.css?v=s1">
<link rel="stylesheet" href="/css/ambience.css?v=s4">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="ambience" aria-hidden="true"><div class="flame-light"></div></div>
<div class="hdr-clouds" aria-hidden="true">
  <div class="cl a1"></div><div class="cl a2"></div>
  <div class="cl b1"></div><div class="cl b2"></div>
</div>
<header class="top" id="top">
  <div class="wrap bar-h">
    <a class="logo" href="/">ПАМЯТЬ<span>.БАЙ</span></a>
    <nav class="menu">
      <a class="link" href="/catalog">Каталог</a>
      <a class="link" href="/calc">Расчёт</a>
      <a class="link" href="/#contact">Контакты</a>
    </nav>
  </div>
</header>
<main class="app-page">
  <div class="wrap wizard">
    <h1>Калькулятор под ключ</h1>
    <p class="app-lead">Шаг за шагом. Сумма — ориентир. Точная смета после замера. Цены правятся в админке.</p>
    <div class="step-nav" id="nav"></div>
    <div id="step"></div>
    <div class="calc-sum" id="sumBox" hidden>
      <p>Ориентировочно: <strong id="sum">0</strong> BYN</p>
      <p class="note">Итог уточняется на замере. Материалы и работа включены «под ключ».</p>
      <form class="form-grid" id="lead" style="margin-top:1rem">
        <input name="name" required placeholder="Имя">
        <input name="phone" required placeholder="Телефон">
        <textarea name="comment" rows="3" placeholder="Комментарий"></textarea>
        <button class="btn btn-gold" type="submit">Отправить заявку</button>
        <a class="btn btn-outline" href="/calc?custom=1">Индивидуальный расчёт</a>
      </form>
      <div class="ok" id="ok" hidden>Заявка принята. Мы свяжемся с вами.</div>
    </div>
  </div>
</main>
<script src="/js/catalog-data.js?v=s1"></script>
<script>
const STEPS=[
  {id:'form', title:'Памятник — форма', opts:[
    {id:'vertical',t:'Вертикальный'},{id:'horizontal',t:'Горизонтальный'},{id:'cross',t:'С крестом'},{id:'double',t:'Двойной'},{id:'exclusive',t:'Эксклюзив'}]},
  {id:'size', title:'Размер стелы, см', opts:[{id:'80',t:'80'},{id:'100',t:'100'},{id:'120',t:'120'}]},
  {id:'stone', title:'Цвет / порода', opts:[{id:'gabbro',t:'Габбро чёрный'},{id:'diabase',t:'Диабаз'},{id:'labrador',t:'Лабрадорит'},{id:'grey',t:'Серый гранит'}]},
  {id:'engraving', title:'Гравировка', opts:[{id:'none',t:'Без'},{id:'text',t:'Текст'},{id:'portrait',t:'Портрет'},{id:'both',t:'Текст и портрет'}]},
  {id:'base', title:'Основание и благоустройство', opts:[{id:'slab',t:'Плита'},{id:'tile',t:'Плитка'},{id:'full',t:'Комплекс под ключ'}]},
  {id:'extra', title:'Декор и доп. услуги', multi:true, opts:[{id:'fence',t:'Ограда'},{id:'vase',t:'Ваза'},{id:'portrait',t:'Фотокерамика'},{id:'grass',t:'Газон'}]}
];
const sel={form:'vertical',size:'100',stone:'gabbro',engraving:'text',base:'full',extra:['fence']};
let i=0;
function total(){
  const P=PAMYAT_PRICES;
  let n=P.form[sel.form]+P.size[sel.size]+P.stone[sel.stone]+P.engraving[sel.engraving]+P.base[sel.base];
  (sel.extra||[]).forEach(e=>n+=P.extra[e]||0);
  return n;
}
function drawNav(){
  document.getElementById('nav').innerHTML=STEPS.map((s,k)=>`<b class="${k===i?'on':''}">${k+1}</b>`).join('');
}
function draw(){
  drawNav();
  const s=STEPS[i];
  const opts=s.opts.map(o=>{
    const on=s.multi?(sel.extra||[]).includes(o.id):sel[s.id]===o.id;
    return `<button type="button" class="opt ${on?'on':''}" data-id="${o.id}">${o.t}</button>`;
  }).join('');
  document.getElementById('step').innerHTML=`<h2>${s.title}</h2><div class="opts">${opts}</div>
    <div class="row" style="display:flex;gap:.6rem;margin-top:1rem">
      ${i>0?'<button class="btn btn-outline" id="prev">Назад</button>':''}
      <button class="btn btn-gold" id="next">${i===STEPS.length-1?'Рассчитать':'Далее'}</button>
    </div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(s.multi){ const set=new Set(sel.extra||[]); set.has(b.dataset.id)?set.delete(b.dataset.id):set.add(b.dataset.id); sel.extra=[...set]; }
    else sel[s.id]=b.dataset.id;
    draw();
  });
  const n=document.getElementById('next'); if(n) n.onclick=()=>{ if(i<STEPS.length-1){i++; draw();} else showSum(); };
  const p=document.getElementById('prev'); if(p) p.onclick=()=>{ i--; draw(); };
}
function showSum(){
  document.getElementById('sumBox').hidden=false;
  document.getElementById('sum').textContent=total();
}
document.getElementById('lead').onsubmit=async (e)=>{
  e.preventDefault();
  const fd=new FormData(e.target);
  const body={
    type:'calc', name:fd.get('name'), phone:fd.get('phone'), comment:fd.get('comment'),
    config:sel, price:total(), source:location.href, at:new Date().toISOString()
  };
  try{ await fetch('/api/lead',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}); }catch(_){}
  const leads=JSON.parse(localStorage.getItem('pamyat_leads')||'[]'); leads.unshift(body); localStorage.setItem('pamyat_leads',JSON.stringify(leads));
  document.getElementById('ok').hidden=false;
};
draw();
</script>
<script src="/js/ambience.js?v=s4"></script>
</body>
</html>
