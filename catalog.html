<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог — ПАМЯТЬ.БАЙ</title>
<link rel="stylesheet" href="/css/base.css?v=s8">
<link rel="stylesheet" href="/css/site.css?v=s8">
<link rel="stylesheet" href="/css/app.css?v=s8">
<link rel="stylesheet" href="/css/ambience.css?v=s8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<header class="top" id="top">
  <div class="wrap bar-h">
    <a class="logo" href="/">ПАМЯТЬ<span>.БАЙ</span></a>
    <nav class="menu">
      <a class="link" href="/catalog">Каталог</a>
      <a class="link" href="/calc">Расчёт</a>
      <a class="link" href="/#contact">Контакты</a>
      <a class="btn btn-outline btn-sm" href="/calc">Рассчитать <span>→</span></a>
    </nav>
  </div>
</header>
<main class="app-page">
  <div class="wrap">
    <h1>Каталог памятников</h1>
    <p class="app-lead">Карточки моделей. Цена «от» — ориентир до замера. Нажмите фото, чтобы увеличить. Памятник может быть из любого гранита.</p>
    <div class="filters" id="filters"></div>
    <div class="grid-cards" id="grid"></div>
  </div>
</main>
<div id="lb" onclick="if(event.target===this)closeLb()">
  <button type="button" id="lbPrev" aria-label="Назад">‹</button>
  <div id="lbInner"></div>
  <button type="button" id="lbNext" aria-label="Вперёд">›</button>
</div>
<style>
#lb{display:none;position:fixed;inset:0;background:rgba(42,36,28,.88);z-index:80;align-items:center;justify-content:center;padding:2rem;gap:1rem}
#lb.on{display:flex}
#lbInner{max-width:min(720px,92vw);color:#f6f1e8;text-align:center;font-family:var(--serif)}
#lbInner img{max-width:100%;max-height:70vh;border-radius:12px}
#lb button{background:transparent;border:1px solid #ddd2bd;color:#f6f1e8;width:44px;height:44px;border-radius:999px;font-size:1.4rem;cursor:pointer}
</style>
<script src="/js/catalog-data.js?v=s7"></script>
<script src="/js/pamyat-store.js?v=s7"></script>
<script>
const CATS=[{id:'all',name:'Все'}].concat(PAMYAT_CATS);
let cur='all', idx=0, list=[];
const f=document.getElementById('filters');
CATS.forEach(c=>{
  const b=document.createElement('button'); b.className='chip'+(c.id==='all'?' on':''); b.textContent=c.name;
  b.onclick=()=>{cur=c.id; [...f.children].forEach(x=>x.classList.toggle('on',x===b)); draw();};
  f.appendChild(b);
});
function draw(){
  list=PAMYAT_CATALOG.filter(x=>cur==='all'||x.cat===cur);
  document.getElementById('grid').innerHTML=list.map((x,i)=>`
    <article class="card-m">
      <div class="ph" onclick="openLb(${i})">${x.title}</div>
      <div class="body">
        <strong>${x.title}</strong>
        <span class="meta">${x.form} · ${x.stone} · ${x.size}</span>
        <p class="meta">${x.desc}</p>
        <span class="price">от ${x.price} BYN</span>
        <div class="row">
          <a class="btn btn-gold btn-sm" href="/calc?form=${x.cat==='cross'?'cross':x.cat==='horizontal'?'horizontal':x.cat==='complex'?'complex':x.cat==='exclusive'?'exclusive':'vertical'}&model=${x.id}">В расчёт</a>
        </div>
      </div>
    </article>`).join('');
}
function openLb(i){ idx=i; const el=document.getElementById('lb'); el.classList.add('on'); show(); }
function closeLb(){ document.getElementById('lb').classList.remove('on'); }
function show(){ const x=list[idx]; document.getElementById('lbInner').innerHTML=`<h2>${x.title}</h2><p>от ${x.price} BYN · ${x.size}</p><p>${x.desc}</p>`; }
document.getElementById('lbPrev').onclick=e=>{e.stopPropagation(); idx=(idx-1+list.length)%list.length; show();};
document.getElementById('lbNext').onclick=e=>{e.stopPropagation(); idx=(idx+1)%list.length; show();};
document.onkeydown=e=>{ if(!document.getElementById('lb').classList.contains('on')) return; if(e.key==='Escape') closeLb(); if(e.key==='ArrowLeft') document.getElementById('lbPrev').click(); if(e.key==='ArrowRight') document.getElementById('lbNext').click(); };
draw();
</script>
</body>
</html>
