<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПАМЯТЬ.БАЙ — предпросмотр главного экрана v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#292521;--gold:#a78343}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Montserrat,Arial,sans-serif}
.hero{height:100svh;min-height:650px;position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(155deg,#c7d7d8 0%,#e7e2d9 42%,#f7dfc7 76%,#d0c3b0 100%);color:var(--ink)}
.plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%;z-index:-2}
.ambient{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(248,239,226,.64),rgba(248,239,226,.23) 47%,transparent 76%),linear-gradient(0deg,rgba(240,228,211,.55),transparent 47%);pointer-events:none}
.cloud-field{position:absolute;inset:-2% 0 auto;height:79%;overflow:hidden;pointer-events:none;z-index:0;mix-blend-mode:screen;mask-image:linear-gradient(to bottom,#000 0%,#000 53%,rgba(0,0,0,.7) 76%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 53%,rgba(0,0,0,.7) 76%,transparent 100%)}
.cloud{position:absolute;width:74vw;height:37vw;min-height:250px;max-height:620px;opacity:.76;will-change:transform;filter:blur(12px);background:radial-gradient(ellipse at 13% 68%,rgba(255,255,255,.9) 0 12%,transparent 33%),radial-gradient(ellipse at 29% 48%,rgba(255,255,255,.94) 0 20%,transparent 43%),radial-gradient(ellipse at 49% 58%,rgba(255,255,255,.86) 0 18%,transparent 42%),radial-gradient(ellipse at 66% 45%,rgba(255,255,255,.83) 0 17%,transparent 40%),radial-gradient(ellipse at 84% 69%,rgba(255,255,255,.8) 0 12%,transparent 34%),radial-gradient(ellipse at 50% 78%,rgba(255,255,255,.85) 0 22%,transparent 48%)}
.cloud.one{top:5%;left:-19%;animation:drift-a 43s linear infinite}.cloud.two{top:28%;left:23%;width:88vw;height:39vw;opacity:.57;filter:blur(18px);animation:drift-b 58s linear infinite}.cloud.three{top:-3%;left:58%;width:66vw;height:33vw;opacity:.5;filter:blur(22px);animation:drift-c 51s linear infinite}.cloud.four{top:39%;left:-25%;width:90vw;height:41vw;opacity:.56;filter:blur(20px);animation:drift-d 64s linear infinite}
@keyframes drift-a{from{transform:translate3d(-12vw,0,0)}to{transform:translate3d(34vw,-1vh,0)}}@keyframes drift-b{from{transform:translate3d(28vw,1vh,0) scale(1.02)}to{transform:translate3d(-19vw,-2vh,0) scale(1.08)}}@keyframes drift-c{from{transform:translate3d(-23vw,0,0) scale(.98)}to{transform:translate3d(25vw,2vh,0) scale(1.05)}}@keyframes drift-d{from{transform:translate3d(-13vw,0,0) scale(1.05)}to{transform:translate3d(24vw,-2vh,0) scale(.98)}}
.content{position:relative;z-index:2;width:min(1240px,100%);height:100%;margin:0 auto;padding:clamp(30px,6.7vw,96px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.brandline{font-size:11px;line-height:1.4;letter-spacing:.19em;font-weight:600;color:#8b6c3a;margin:0 0 25px;text-transform:uppercase}
h1{font-size:clamp(51px,7vw,94px);font-weight:500;letter-spacing:-.065em;line-height:1.02;max-width:820px;margin:0 0 27px;text-wrap:balance}
.rule{width:52px;height:2px;background:#b28d4b;margin-bottom:19px}.sub{max-width:440px;font-size:clamp(16px,1.35vw,18px);line-height:1.62;font-weight:400;color:#49413a;margin:0 0 28px;text-wrap:pretty}
.cta{min-height:48px;padding:0 23px;display:inline-flex;align-items:center;gap:19px;border-radius:999px;background:linear-gradient(180deg,#ad8948,#8f6e34);box-shadow:0 12px 28px rgba(92,65,29,.25);font-size:13px;font-weight:600;color:white;text-decoration:none;transition:transform .25s,box-shadow .25s}.cta:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(92,65,29,.34)}
.scroll-note{position:absolute;right:clamp(22px,4vw,54px);bottom:30px;z-index:3;display:flex;align-items:center;gap:11px;color:#5e554c;font-size:10px;letter-spacing:.15em;text-transform:uppercase}.scroll-note:before{content:"";height:34px;width:1px;background:rgba(80,67,52,.5)}
.preview-tag{position:absolute;left:20px;top:18px;z-index:5;padding:8px 10px;background:rgba(255,255,255,.6);border:1px solid rgba(75,60,42,.15);border-radius:5px;font:10px/1.3 Arial,sans-serif;letter-spacing:.05em;color:#574b3b}
@media(max-width:700px){.hero{min-height:650px;max-height:940px}.plate{object-position:62% center}.ambient{background:linear-gradient(0deg,rgba(248,239,226,.94),rgba(248,239,226,.84) 30%,rgba(248,239,226,.15) 68%,rgba(248,239,226,.02))}.cloud-field{height:73%;mask-image:linear-gradient(to bottom,#000 0%,#000 58%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 58%,transparent 100%)}.cloud{width:124vw;height:60vw;min-height:235px;filter:blur(9px);opacity:.8}.cloud.one{top:10%;left:-45%;animation-duration:35s}.cloud.two{top:31%;left:-5%;width:145vw;height:63vw;opacity:.6;animation-duration:47s}.cloud.three{top:1%;left:43%;width:105vw;height:53vw;opacity:.62;animation-duration:42s}.cloud.four{top:39%;left:-48%;width:145vw;height:68vw;opacity:.62;animation-duration:52s}.content{justify-content:flex-end;padding:0 24px 82px}.brandline{font-size:10px;letter-spacing:.16em;margin-bottom:17px}h1{font-size:clamp(40px,10.8vw,58px);line-height:1.04;letter-spacing:-.06em;margin-bottom:21px;max-width:100%}.rule{width:42px;margin-bottom:15px}.sub{font-size:15px;line-height:1.55;max-width:34ch;margin-bottom:21px}.cta{min-height:47px;padding:0 19px;font-size:12px}.scroll-note{right:20px;bottom:20px;font-size:9px;gap:8px}.scroll-note:before{height:25px}}
@media(max-width:380px){.content{padding-left:20px;padding-right:20px;padding-bottom:72px}h1{font-size:39px;letter-spacing:-.055em}.sub{font-size:14px}}
@media(prefers-reduced-motion:reduce){.cloud{animation:none!important}}
</style></head><body>
<main class="hero">
<img class="plate" src="https://pamyat-bai-demo.vercel.app/assets/img/hero-plate.jpg" alt="" onerror="this.style.display='none'">

<div class="preview-tag">ПРЕДПРОСМОТР · ВЕРСИЯ 2</div>
<section class="content"><p class="brandline">ПАМЯТЬ.БАЙ · ПАМЯТНИКИ ПОД КЛЮЧ</p><h1>Память,<br>которая живёт</h1><div class="rule"></div><p class="sub">Памятники из гранита, установка под ключ и благоустройство участка. Беларусь.</p><a class="cta" href="#contact">Рассчитать стоимость <span aria-hidden="true">→</span></a></section>
<div class="scroll-note">Листайте вниз</div>
</main></body></html>
